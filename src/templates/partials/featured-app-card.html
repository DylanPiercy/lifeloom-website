<article class="home-featured-app" style="--app-card-colour:{{APP_COLOUR}}">
  <div class="home-featured-content">
    <div class="home-featured-meta">
      <span class="featured-app-badge">{{FEATURED_EYEBROW}}</span>
      {{APP_STATUS}}
    </div>
    <span class="home-featured-kicker">{{APP_EYEBROW}}</span>
    <h2>{{APP_NAME}}</h2>
    <p>{{FEATURED_DESCRIPTION}}</p>
    <div class="home-featured-tags">{{FEATURED_TAGS}}</div>
    {{APP_EXPLORE_BUTTON}}
  </div>

  <div class="home-featured-visual" aria-hidden="true">
    <span class="home-featured-glow"></span>
    <span class="home-featured-orbit home-featured-orbit-large"></span>
    <span class="home-featured-orbit home-featured-orbit-small"></span>
    <div class="home-featured-icon-shell">
      <img class="home-featured-icon" src="{{APP_LOGO_ASSET}}?v={{ASSET_VERSION}}" alt="">
    </div>
    <span class="home-featured-watermark">{{APP_NAME}}</span>
  </div>
</article>
